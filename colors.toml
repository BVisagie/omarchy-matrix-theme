# Matrix (1999)
# CRT phosphor, not laser lime. The rain on the lock can stay hotter;
# the desktop and the terminal sit in the body of the stream.

mode = "dark"

accent = "#3CBF5C"
cursor = "#C5E6C6"
selection = "#23482A"
muted = "#678D6A"

background = "#080C09"
dark_background = "#050705"
darker_background = "#020302"
lighter_background = "#121A13"

foreground = "#8BC98C"
dark_foreground = "#678D6A"
light_foreground = "#A8D4A9"
bright_foreground = "#C5E6C6"

selection_foreground = "#C5E6C6"
selection_background = "#23482A"

hyprland_active_border = "rgba(3CBF5Cbb) rgba(1A5A2888) 45deg"
hyprland_inactive_border = "rgba(1A332088)"

# Muted text and errors remain readable on the lifted panel background.
# Syntax stays in-world: phosphor, sickly lime, brick, a little teal.
red = "#D15D57"
yellow = "#B8BA48"
orange = "#7AAA48"
green = "#2D9A48"
cyan = "#4BB56A"
