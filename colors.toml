# Matrix (1999)
# Phosphor-green simulation. Shadows lift olive, not gray.
# Accent matches the digital rain: #00FF41.

mode = "dark"

accent = "#00FF41"
cursor = "#E8FFE8"
selection = "#0D3B14"
muted = "#3D6B42"

background = "#070B08"
dark_background = "#040605"
darker_background = "#010201"
lighter_background = "#121A14"

foreground = "#B7E4B8"
dark_foreground = "#3D6B42"
light_foreground = "#D4F5D4"
bright_foreground = "#E8FFE8"

selection_foreground = "#E8FFE8"
selection_background = "#0D3B14"

hyprland_active_border = "rgba(00FF41ee) rgba(007A28aa) 45deg"

