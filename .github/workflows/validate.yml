name: Validate theme

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install renderer and shader validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-cairo python3-gi python3-gi-cairo python3-pil gir1.2-pango-1.0 fonts-noto-cjk glslang-tools
      - name: Check palette, wallpapers, renderer, launcher, and shader
        run: /usr/bin/python3 -m unittest discover -s tests -v
